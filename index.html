<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UFX CAPITAL - Payment Gateway</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #0d0f12;
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .payment-card {
            background: #161920;
            border: 1px solid #232733;
            border-radius: 12px;
            padding: 25px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
        }

        .modal-field {
            margin-bottom: 15px;
            text-align: left;
        }

        .modal-field label {
            display: block;
            font-size: 12px;
            margin-bottom: 5px;
            color: #a0aec0;
        }

        .modal-field input, .modal-field select {
            width: 100%;
            padding: 10px;
            background: #0d0f12;
            border: 1px solid #232733;
            border-radius: 6px;
            color: #fff;
            box-sizing: border-box;
            outline: none;
        }

        .modal-field input:focus {
            border-color: #ff0055;
        }

        .modal-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(45deg, #ff0055, #ff5500);
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .modal-btn:hover {
            opacity: 0.9;
        }

        .wallet-display-container {
            background: #11141a;
            border: 1px solid #ff0055;
            border-radius: 8px;
            padding: 20px;
            margin-top: 15px;
        }

        .wallet-box {
            background: #000;
            padding: 10px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 16px;
            color: #00ff55;
            margin: 8px 0;
            word-break: break-all;
        }

        .copy-btn {
            padding: 8px 14px;
            border: none;
            border-radius: 5px;
            color: #fff;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .copy-btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }
    </style>
</head>
<body>

<div class="payment-card">

    <!-- STEP 1: USER DETAILS FORM -->
    <div id="userInfoStep">
        <h3 style="font-family: 'Orbitron', sans-serif; color: #ff0055; margin-top:0;">UFX CAPITAL</h3>
        <p style="font-size: 12px; color:#a0aec0; margin-bottom: 20px;">Enter your details to proceed with payment</p>
        
        <div class="modal-field">
            <label>Full Name</label>
            <input type="text" id="cust_name" placeholder="Enter Full Name">
        </div>
        <div class="modal-field">
            <label>Email Address</label>
            <input type="email" id="cust_email" placeholder="Enter Email Address">
        </div>
        <div class="modal-field">
            <label>Phone Number</label>
            <input type="text" id="cust_phone" placeholder="Enter Phone Number">
        </div>
        <div class="modal-field">
            <label>Select Plan / Package</label>
            <select id="cust_plan">
                <option value="Basic Plan - ₹1000">Basic Plan - ₹1,000</option>
                <option value="Pro Plan - ₹5000">Pro Plan - ₹5,000</option>
                <option value="VIP Plan - ₹10000">VIP Plan - ₹10,000</option>
            </select>
        </div>
        <button class="modal-btn" onclick="proceedToPayment()">PROCEED TO PAY</button>
    </div>

    <!-- STEP 2: DISPLAY DIRECT PHONEPE / GPAY & UTR FORM -->
    <div id="upiDisplayBox" class="wallet-display-container" style="display: none;">
        <i class="fa-solid fa-qrcode" style="font-size: 36px; color: #00ff55; margin-bottom: 8px;"></i>
        <h4 style="color:#ffffff; margin: 0 0 10px 0; font-family:'Orbitron', sans-serif; font-size:16px;">Pay via PhonePe / GPay</h4>
        <p style="color:#a0aec0; font-size:12px; margin-bottom:12px;">Select app to pay or copy UPI ID & enter 12-Digit UTR Number:</p>
        
        <div style="font-weight:bold; color:#ff0055; font-size:13px;">UFX Capital UPI ID:</div>
        <div class="wallet-box" id="upiIdText">9649638812@ybl</div>
        
        <!-- DIRECT APP BUTTONS -->
        <div style="display:flex; justify-content:center; gap:8px; flex-wrap:wrap; margin-bottom:12px;">
            <a href="phonepe://pay?pa=9649638812@ybl&pn=UFX%20CAPITAL&cu=INR" class="copy-btn" style="background:#5f259f; text-decoration:none;">
                <i class="fa-solid fa-mobile-screen"></i> PhonePe
            </a>
            <a href="tez://upi/pay?pa=9649638812@ybl&pn=UFX%20CAPITAL&cu=INR" class="copy-btn" style="background:#4285f4; text-decoration:none;">
                <i class="fa-brands fa-google-pay" style="font-size:16px;"></i> Google Pay
            </a>
            <button class="copy-btn" onclick="copyUpiId()" style="background:#333;"><i class="fa-solid fa-copy"></i> Copy UPI</button>
        </div>
        <div id="upiCopyMsg" style="color:#00ff55; font-size:11px; margin-top:-5px; margin-bottom:10px; display:none;">UPI ID Copied!</div>

        <!-- SUBMIT UTR FORM -->
        <form action="https://api.web3forms.com/submit" method="POST" onsubmit="submitUtrForm(event)" style="border-top:1px dashed rgba(255,0,85,0.3); padding-top:15px; margin-top:10px;">
            <input type="hidden" name="access_key" value="64e790b0-5df7-46e8-a8f4-29328ef00926">
            <input type="hidden" name="subject" value="NEW UPI PAYMENT: UTR Verification Submitted">
            <input type="hidden" name="from_name" value="UFX PhonePe/GPay Payment">
            <input type="hidden" name="Payment_Method" value="PhonePe / GPay UPI">
            
            <input type="hidden" name="Customer_Name" id="final_upi_name">
            <input type="hidden" name="Customer_Email" id="final_upi_email">
            <input type="hidden" name="Customer_Phone" id="final_upi_phone">
            <input type="hidden" name="Selected_Plan" id="final_upi_plan">
            
            <div class="modal-field">
                <label style="color:#ff0055; text-align:left; font-weight:bold;">Enter 12-Digit UTR / Transaction Ref No:</label>
                <input type="text" name="UTR_Ref_Number" id="utr_input" required placeholder="e.g. 402819284910">
            </div>
            <button type="submit" id="utrBtn" class="modal-btn">SUBMIT UTR FOR VERIFICATION</button>
        </form>
    </div>

</div>

<script>
    function proceedToPayment() {
        const name = document.getElementById('cust_name').value.trim();
        const email = document.getElementById('cust_email').value.trim();
        const phone = document.getElementById('cust_phone').value.trim();
        const plan = document.getElementById('cust_plan').value;

        if(!name || !email || !phone) {
            alert('Please fill all the details before proceeding.');
            return;
        }

        // Fill data into hidden inputs
        document.getElementById('final_upi_name').value = name;
        document.getElementById('final_upi_email').value = email;
        document.getElementById('final_upi_phone').value = phone;
        document.getElementById('final_upi_plan').value = plan;

        // Hide user info step and show payment options
        document.getElementById('userInfoStep').style.display = 'none';
        document.getElementById('upiDisplayBox').style.display = 'block';
    }

    function copyUpiId() {
        const upiText = document.getElementById('upiIdText').innerText;
        navigator.clipboard.writeText(upiText).then(() => {
            const msg = document.getElementById('upiCopyMsg');
            msg.style.display = 'block';
            setTimeout(() => { msg.style.display = 'none'; }, 2500);
        });
    }

    function submitUtrForm(event) {
        const utr = document.getElementById('utr_input').value.trim();
        if(!utr) {
            event.preventDefault();
            alert('Please enter a valid 12-Digit UTR number.');
            return false;
        }
        document.getElementById('utrBtn').innerText = "SUBMITTING...";
    }
</script>

</body>
</html>
