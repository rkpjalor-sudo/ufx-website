<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crypto Payment Checkout</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0b0b0e;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Crypto Container Box */
    .crypto-box {
      border: 1.5px solid #ff0055;
      border-radius: 12px;
      padding: 25px 20px 20px;
      position: relative;
      background: #0d0d12;
      box-shadow: 0 0 15px rgba(255, 0, 85, 0.2);
      max-width: 900px;
      width: 100%;
    }

    .crypto-header {
      position: absolute;
      top: -14px;
      left: 50%;
      transform: translateX(-50%);
      background: #0d0d12;
      padding: 0 15px;
      color: #fff;
      font-weight: 700;
      font-size: 16px;
      letter-spacing: 1.5px;
      white-space: nowrap;
    }

    .crypto-header::before, .crypto-header::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 15px;
      height: 2px;
      background: #ff0055;
    }
    .crypto-header::before { left: -10px; }
    .crypto-header::after { right: -10px; }

    .crypto-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 15px;
      margin-top: 10px;
    }

    .crypto-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      padding: 15px 10px;
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      transition: all 0.3s ease;
    }

    .crypto-item:last-child {
      border-right: none;
    }

    .crypto-item:hover {
      transform: translateY(-6px);
    }

    .icon-wrapper {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      transition: transform 0.4s ease;
    }

    .crypto-item:hover .icon-wrapper {
      transform: scale(1.12) rotate(5deg);
    }

    .crypto-name {
      font-weight: bold;
      font-size: 15px;
      color: #ffffff;
    }

    .crypto-sub {
      font-size: 12px;
      color: #a0a0a0;
      margin-top: 2px;
    }

    /* Modal / Form Styles */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(6px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: #14141c;
      border: 1px solid #ff0055;
      border-radius: 12px;
      width: 92%;
      max-width: 480px;
      padding: 25px;
      position: relative;
      max-height: 90vh;
      overflow-y: auto;
      animation: popup 0.3s ease-out forwards;
    }

    @keyframes popup {
      from { transform: scale(0.85); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .close-btn {
      position: absolute;
      top: 15px; right: 15px;
      color: #aaa;
      font-size: 22px;
      cursor: pointer;
    }

    .modal-title {
      font-size: 18px;
      margin-bottom: 15px;
      text-align: center;
      color: #ff0055;
      font-weight: bold;
    }

    .address-box {
      background: #09090d;
      border: 1px dashed #444;
      padding: 10px;
      border-radius: 6px;
      font-size: 12px;
      word-break: break-all;
      color: #00ffcc;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .copy-btn {
      background: #ff0055;
      border: none;
      color: white;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
      margin-left: 8px;
    }

    .form-group {
      margin-bottom: 10px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      color: #ccc;
      margin-bottom: 4px;
    }

    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 9px;
      background: #09090d;
      border: 1px solid #333;
      border-radius: 6px;
      color: #fff;
      font-size: 13px;
    }

    .submit-btn {
      width: 100%;
      background: #ff0055;
      border: none;
      color: white;
      padding: 12px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    .submit-btn:hover {
      background: #e0004c;
    }

    .step-2 {
      display: none;
    }
  </style>
</head>
<body>

  <!-- CRYPTO PAYMENT SECTION -->
  <div class="crypto-box">
    <div class="crypto-header">CRYPTO PAYMENT</div>
    
    <div class="crypto-grid">
      
      <!-- TRC20 -->
      <div class="crypto-item" onclick="openModal('USDT (TRC20)', 'TP1hUt5spzMv5LoHjAU2yEQus-Egj8NDwb')">
        <div class="icon-wrapper">
          <svg width="60" height="60" viewBox="0 0 200 200">
            <circle cx="100" cy="100" r="95" fill="#26A17B"/>
            <path d="M60 65h80v15H108.5v18h28v15h-28v32H91.5V113h-28V98h28V80H60V65z" fill="#FFF"/>
            <ellipse cx="100" cy="88" rx="35" ry="10" fill="none" stroke="#FFF" stroke-width="5"/>
          </svg>
        </div>
        <div class="crypto-name">TRC20</div>
        <div class="crypto-sub">(USDT)</div>
      </div>

      <!-- ERC20 -->
      <div class="crypto-item" onclick="openModal('USDT (ERC20)', '0x4aea8cb300c-cca979c1be6ff1b7727e2c57cc5ab')">
        <div class="icon-wrapper">
          <svg width="60" height="60" viewBox="0 0 200 200">
            <polygon points="100,15 160,110 100,85 40,110" fill="#627EEA"/>
            <polygon points="100,15 100,85 160,110" fill="#454A75"/>
            <polygon points="100,95 160,120 100,185 40,120" fill="#627EEA"/>
            <polygon points="100,95 100,185 160,120" fill="#454A75"/>
          </svg>
        </div>
        <div class="crypto-name">ERC20</div>
        <div class="crypto-sub">(USDT)</div>
      </div>

      <!-- BEP20 -->
      <div class="crypto-item" onclick="openModal('USDT (BEP20)', '0x4aea8cb300c-cca979c1be6ff1b7727e2c57cc5ab')">
        <div class="icon-wrapper">
          <svg width="60" height="60" viewBox="0 0 200 200">
            <rect width="200" height="200" rx="40" fill="#F3BA2F"/>
            <path d="M100 40l22 22-38 38 16 16 22-22 22 22-38 38 22 22 60-60L100 40zm-38 38L40 100l22 22 22-22-22-22zm76 0l22 22-22 22-22-22 22-22z" fill="#FFF"/>
          </svg>
        </div>
        <div class="crypto-name">BEP20</div>
        <div class="crypto-sub">(USDT)</div>
      </div>

      <!-- BITCOIN -->
      <div class="crypto-item" onclick="openModal('Bitcoin (BTC)', '143odbY9gkjo8de7NizwFuz-WD11Muw9QW4')">
        <div class="icon-wrapper">
          <svg width="60" height="60" viewBox="0 0 200 200">
            <circle cx="100" cy="100" r="95" fill="#F7931A"/>
            <path d="M128 82c2-12-7-18-20-22l4-16-10-2.5-4 15c-2.5-.6-5-.12-8-1.7l4-15.5L84 37l-4 16s-6-1.4-6-1.5l-8-2-3 12s8 2 8 2c4.5 1 5.3 4 5 6.5l-5 21c.3.1.7.3 1.2.5-.4-.1-.8-.3-1.2-.5l-7 29c-.6 1.4-2 3.5-5 2.7 0 0-8-2-8-2l-5 13 8 2c2.5.6 5 1.3 7.5 2l-4 17 10 2.5 4-16c2.7.7 5.3 1.4 8 2l-4 16 10 2.5 4-16c17 3.2 30 2 35-14 4-12.5-0.2-20-9-24.5 6.5-1.5 11.5-6 12.8-15.5z" fill="#FFF"/>
          </svg>
        </div>
        <div class="crypto-name">BITCOIN</div>
        <div class="crypto-sub">(BTC)</div>
      </div>

    </div>
  </div>

  <!-- POPUP FORM WITH EMAIL TRIGGER -->
  <div class="modal-overlay" id="paymentModal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      <div class="modal-title" id="modalTitle">Crypto Checkout</div>
      
      <!-- FORM SUBMISSION TO YOUR EMAIL -->
      <form action="https://formsubmit.co/rkpjalor@gmail.com" method="POST">
        <input type="hidden" name="_captcha" value="false">
        <input type="hidden" name="_template" value="table">
        <input type="hidden" name="Selected Crypto Network" id="cryptoNetworkInput">

        <!-- STEP 1: USER DETAILS & PLAN -->
        <div id="step1">
          <div class="form-group">
            <label>Select Plan</label>
            <select name="Selected Plan" required>
              <option value="" disabled selected>Choose a Plan</option>
              <option value="Basic Plan - $100">Basic Plan ($100)</option>
              <option value="Standard Plan - $240">Standard Plan ($240)</option>
              <option value="Premium Plan - $500">Premium Plan ($500)</option>
            </select>
          </div>

          <div class="form-group">
            <label>1. Full Name</label>
            <input type="text" name="Full Name" placeholder="John Doe" required>
          </div>

          <div class="form-group">
            <label>2. PAN / National ID Number</label>
            <input type="text" name="PAN or National ID" placeholder="ID Number" required>
          </div>

          <div class="form-group">
            <label>3. Country of Residence</label>
            <input type="text" name="Country" placeholder="e.g. United States" required>
          </div>

          <div class="form-group">
            <label>4. State / Province</label>
            <input type="text" name="State" placeholder="e.g. California" required>
          </div>

          <div class="form-group">
            <label>5. City / Village / Town</label>
            <input type="text" name="City" placeholder="e.g. Los Angeles" required>
          </div>

          <div class="form-group">
            <label>6. Pin / Zip Code</label>
            <input type="text" name="Pin Code" placeholder="90001" required>
          </div>

          <div class="form-group">
            <label>7. Full Address</label>
            <textarea name="Full Address" rows="2" placeholder="Street Address, House No..." required></textarea>
          </div>

          <button type="button" class="submit-btn" onclick="goToStep2()">Proceed to Payment →</button>
        </div>

        <!-- STEP 2: WALLET ADDRESS & TXID -->
        <div id="step2" class="step-2">
          <p style="font-size: 12px; color: #aaa; margin-bottom: 5px;">Transfer exact amount to this Wallet Address:</p>
          <div class="address-box">
            <span id="walletAddress">Loading...</span>
            <button type="button" class="copy-btn" onclick="copyAddress()">Copy</button>
          </div>

          <div class="form-group">
            <label>Transaction Hash / ID (TxID)</label>
            <input type="text" name="Transaction TxID" placeholder="Paste TxID after sending payment" required>
          </div>

          <button type="submit" class="submit-btn">Complete & Submit Order</button>
          <button type="button" style="background:transparent; border:none; color:#aaa; font-size:11px; margin-top:8px; cursor:pointer; width:100%;" onclick="goToStep1()">← Back to Details</button>
        </div>

      </form>
    </div>
  </div>

  <script>
    let currentAddress = "";

    function openModal(network, address) {
      currentAddress = address;
      document.getElementById('modalTitle').innerText = network + ' Payment';
      document.getElementById('cryptoNetworkInput').value = network;
      document.getElementById('walletAddress').innerText = address;
      document.getElementById('paymentModal').style.display = 'flex';
      goToStep1();
    }

    function closeModal() {
      document.getElementById('paymentModal').style.display = 'none';
    }

    function goToStep2() {
      // Validate Step 1 Inputs
      const inputs = document.getElementById('step1').querySelectorAll('input, select, textarea');
      for (let input of inputs) {
        if (!input.checkValidity()) {
          input.reportValidity();
          return;
        }
      }
      document.getElementById('step1').style.display = 'none';
      document.getElementById('step2').style.display = 'block';
    }

    function goToStep1() {
      document.getElementById('step2').style.display = 'none';
      document.getElementById('step1').style.display = 'block';
    }

    function copyAddress() {
      navigator.clipboard.writeText(currentAddress);
      alert('Wallet address copied to clipboard!');
    }
  </script>
</body>
</html>
